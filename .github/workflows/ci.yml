name: CI

on:
  push:
    branches:
      - main
      - claude/igor-workshop-website-yrdani
      - fix/finance-ledger-20260918
      - fix/split-payments-20260918
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
