name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

jobs:
  sync-pages-branch:
    permissions:
      contents: write
      actions: write
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Sync allowed Pages branch
        run: |
          git fetch origin claude/igor-workshop-website-yrdani:refs/remotes/origin/claude/igor-workshop-website-yrdani
          git push --force-with-lease origin HEAD:refs/heads/claude/igor-workshop-website-yrdani
      - name: Start Pages deployment from allowed branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref claude/igor-workshop-website-yrdani

  build:
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/igor-workshop-website-yrdani'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit (non-blocking for Pages)
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/igor-workshop-website-yrdani'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
